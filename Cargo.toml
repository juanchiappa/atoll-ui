[workspace]
resolver = "2"
members = [
    "core/atoll-core",
    "core/atoll-platform",
    "core/atoll-render",
    "packages/atoll-ipc",
    "packages/atoll-plugin-sdk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/juanchiappa/atoll-ui"
authors = ["Juan Ignacio Chiappa"]

[workspace.dependencies]
atoll-platform = { path = "core/atoll-platform" }
atoll-render = { path = "core/atoll-render" }
atoll-ipc = { path = "packages/atoll-ipc" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
